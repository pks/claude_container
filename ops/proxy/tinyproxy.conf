# Bench egress allowlist proxy. Default-deny: only CONNECT/GET to hosts matching
# /etc/tinyproxy/allowlist (built at start from $INFERENCE_ALLOWLIST) is permitted;
# everything else is refused. The agent runs on an --internal docker network with
# this proxy as its only route out, so this is the sole egress path.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 200
LogFile "/tmp/tinyproxy.log"
LogLevel Warning
# Source-allow is wide open on purpose — the --internal network already isolates
# who can reach the proxy; destination is what we restrict.
Allow 0.0.0.0/0
# HTTPS tunneling only to 443 (the inference API). No other CONNECT ports.
ConnectPort 443
# Destination allowlist. FilterURLs Off → match on host, not full URL.
# FilterExtended On → POSIX extended regex. FilterDefaultDeny Yes → deny unless matched.
Filter "/tmp/mtbench-allowlist"
FilterURLs Off
FilterExtended On
FilterDefaultDeny Yes
